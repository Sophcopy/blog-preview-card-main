<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />
    <title>Frontend Mentor | Blog preview card</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <section class="card">
      <div class="img">
        <img src="/assets/images/illustration-article.svg" />
      </div>

      <div class="text">
        <h4>Learning</h4>
      </div>

      <p class="pub-date">Published 21 Dec 2023</p>

      <h1>HTML & CSS foundations</h1>

      <p class="intro">
        These languages are the backbone of every
        website, defining structure, content, and
        presentation.
      </p>

      <div class="avatar-main">
        <img src="/assets/images/image-avatar.webp" alt="avatar" />
        <h3>Greg Hooper</h3>
      </div>
    </section>
    <footer class="attribution">
        Challenge by
        <a href="https://www.frontendmentor.io?ref=challenge"
          >Frontend Mentor</a
        >
        Coded by <a href="https://www.github.com/SophCopy"> SophCopy</a>.
      </footer>
  </body>
</html>
