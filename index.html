<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />
    <title>Frontend Mentor | Blog preview card</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <section class="card">
      <div class="img">
        <img src="/assets/images/illustration-article.svg" />
      </div>

      <div class="text">
        <h4>Learning</h4>
      </div>

      <p>Published 21 Dec 2023</p>

      <h1>HTML & CSS foundations</h1>

      <p class="intro">
        These languages are the backbone of every <br />
        website, defining structure, content, and <br />
        presentation.
      </p>

      <div class="avatar-main">
        <div class="avatar-container">
          <img src="/assets/images/image-avatar.webp" alt="avatar" />
        </div>
        <h3>Greg Hooper</h3>
      </div>

      <footer class="attribution">
        Challenge by
        <a href="https://www.frontendmentor.io?ref=challenge"
          >Frontend Mentor</a
        >
        Coded by <a href="https://www.github.com/SophCopy"> SophCopy</a>.
      </footer>
    </section>
  </body>
</html>
